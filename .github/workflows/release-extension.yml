name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  chrome:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    env:
      WXT_SUPABASE_URL: ${{ vars.WXT_SUPABASE_URL }}
      WXT_SUPABASE_PUBLISHABLE_KEY: ${{ vars.WXT_SUPABASE_PUBLISHABLE_KEY }}
      WXT_DASHBOARD_URL: ${{ vars.WXT_DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Require production public configuration
        run: |
          test -n "$WXT_SUPABASE_URL"
          test -n "$WXT_SUPABASE_PUBLISHABLE_KEY"
          test -n "$WXT_DASHBOARD_URL"
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run zip
      - name: Publish Chrome prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          .output/*-chrome.zip
          --prerelease
          --generate-notes
          --title "LeetLedger ${GITHUB_REF_NAME}"
